<!DOCTYPE html>
<html>
<head>
    <title>PDF Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-container">

    <h1 class="app-title">PDF Assistant</h1>

    <!-- Upload Section -->
    <div class="upload-section">
        <input type="file" id="fileInput">
        <button id="uploadBtn">Upload</button>
    </div>

    <div id="uploadStatus" class="status-text"></div>

    <div id="errorBox" class="error-box"></div>

    <div id="loading" class="loading">Processing...</div>

    <div id="chatSection" class="chat-section">

        <div id="chatBox" class="chat-container"></div>

        <div class="input-section">
            <input type="text" id="questionInput" placeholder="Ask anything about the document...">
            <button id="askBtn">Send</button>
        </div>

    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
